name: Env, Inputs and Outputs Lab

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      version:
        description: Version à déployer
        required: true
        default: 1.0.0
        type: string
      debug:
        description: Activer les informations de débogage
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "APP_NAME=my-app" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Print environment variables
        run: echo "Application $APP_NAME built on $BUILD_DATE"

      - name: Print deployment inputs
        run: echo "Deploying version ${{ inputs.version }} to ${{ inputs.environment }}"

      - name: Print debug information
        if: ${{ inputs.debug }}
        run: echo "Debug mode enabled for ${{ inputs.environment }}"

  verify-env:
    runs-on: ubuntu-latest
    steps:
      - name: Print APP_NAME
        run: echo "APP_NAME=${APP_NAME:-<not set>}"
