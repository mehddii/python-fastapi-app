name: CI

on: [push, pull_request]

jobs:
  meta-data:
    env:
      APP_NAME: fastapi-starter
    runs-on: ubuntu-latest
    steps:
      - name: Display meta data
        run: |
          echo "Application: ${{ env.APP_NAME }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Head ref: ${{ github.head_ref }}"
          echo "Base ref: ${{ github.base_ref }}"

  lint:
    name: Lint – Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Vérifier le style
        run: ruff check .

  build:
    name: Build – Vérifier l’application
    runs-on: ubuntu-latest
    steps:
      # même début que lint, puis :
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Installer les dépendances
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: Compiler le code
        run: python -m compileall app
      - name: Importer l’application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test – Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      # même début que lint, puis : pytest
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Installer les dépendances
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: Executer les tests
        run: pytest 

